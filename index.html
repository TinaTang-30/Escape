  <script>
    const STORAGE_KEY = 'escape_bar_themes_v1';
    const RECORDS_STORAGE_KEY = 'escape_bar_records_v1';
    const ACTIVE_TAB_KEY = 'escape_bar_active_tab_v1';
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz0s0FRSxKAVd3JLmUtFCqnKYQG8l-7IVNA3jMC-LnuWtK5H_soKF_MiKU7cDAlo7q1/exec";

    const SYNC_TIMEOUT_MS = 20000;

    // 以目前「主題」工作表為基底的初始資料（僅在從未同步成功、且本機無資料時作為離線備援）

        themeType: "新手入門、劇情厲害、緊張刺激、場景逼真、feature_17",
        studio: "開溜製造所",
        players: 6,
        price: 1380,
        priceRange: "3人：$2,180 / 人\n4人：$1,780 / 人\n5人：$1,580 / 人\n6人：$1,380 / 人",
        duration: "120分鐘"
      },
      {
        no: 3,
        title: "玩偶之家 Dolls' House",
        themeType: "恐怖驚悚、沉浸式劇場、聲光震撼、演技精湛、零解謎",
        studio: "夢遊王國",
        players: 8,
        price: 2299,
        priceRange: "優惠時段\n6人：$2,499 / 人\n7人：$2,299 / 人\n8人：$2,099 / 人\n一般時段\n6人：$2,699 / 人\n7人：$2,499 / 人\n8人：$2,299 / 人",
        duration: "120分鐘"
      },
      {
        no: 4,
        title: "INSANE",
        themeType: "極度恐怖、美式驚悚、近距離互動、零謎題、感官衝擊",
        studio: "夢遊王國",

        duration: "120分鐘"
      }
    ];

    let allGames = loadGames();
    let selectedTag = "";
    let selectedGameNo = allGames.length > 0 ? allGames[0].no : null;

    // 「清單」紀錄（已預訂／已完成），null 代表尚未取得過
    let allRecords = loadRecords();
    let recordsNotice = "";

    function loadGames() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {
        console.warn("讀取本機資料失敗，使用預設資料", e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_GAMES));
    }

    function saveGames(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {
        console.warn("儲存主題資料至本機失敗", e);
      }
    }

    function loadRecords() {
      try {
        const raw = localStorage.getItem(RECORDS_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed.map(normalizeRecord).filter(Boolean);
        }
      } catch (e) {
        console.warn("讀取本機紀錄失敗", e);
      }
      return null;
    }

    function saveRecords(list) {

      } catch (e) {
        console.warn("儲存紀錄至本機失敗", e);
      }
    }

    function loadActiveTab() {
      try {
        const t = localStorage.getItem(ACTIVE_TAB_KEY);
        if (["booked", "completed", "themes"].includes(t)) return t;
      } catch (e) { /* 忽略 */ }
      return "booked";
    }

    function splitTags(themeTypeStr) {
      if (!themeTypeStr) return [];
      return String(themeTypeStr)
        .split(/[、,／/|#\n]+/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    /* ---------- 日期與數字工具（以台灣時區判斷今日） ---------- */

    // 今日（Asia/Taipei）→ "yyyy-MM-dd"
    function getTodayKey() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TIMEZONE, year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      const get = t => parts.find(p => p.type === t).value;
      return `${get("year")}-${get("month")}-${get("day")}`;
    }

    // 接受 "2026/12/15"、"2026-12-15"、"2026.12.15"、"2026年12月15日"、民國 "115/12/15"、ISO 字串 → "yyyy-MM-dd"
    function toDateKey(value) {
      if (value === null || value === undefined) return "";
      const str = String(value).trim();
      if (!str) return "";
      const m = str.match(/^(\d{2,4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/);
      if (m && !/T\d{2}:/.test(str)) {
        let y = Number(m[1]);
        if (y < 1000) y += 1911;
        const mo = Number(m[2]);
        const d = Number(m[3]);
        const check = new Date(Date.UTC(y, mo - 1, d));
        if (check.getUTCFullYear() !== y || check.getUTCMonth() !== mo - 1 || check.getUTCDate() !== d) return "";
        return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      }
      // ISO 日期時間（例如舊版後端直接輸出 Date）→ 以台灣時區換算日期
      const dt = new Date(str);
      if (isNaN(dt.getTime())) return "";
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TIMEZONE, year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(dt);
      const get = t => parts.find(p => p.type === t).value;
      return `${get("year")}-${get("month")}-${get("day")}`;
    }

    // "2022-08-07" → "2022/8/7"
    function formatDateKey(key) {
      if (!key) return "—";
      const [y, m, d] = key.split("-").map(Number);
      return `${y}/${m}/${d}`;
    }

    function daysUntil(key) {
      const toUtc = k => { const [y, m, d] = k.split("-").map(Number); return Date.UTC(y, m - 1, d); };
      return Math.round((toUtc(key) - toUtc(getTodayKey())) / 86400000);
    }

    // 只有單一數字時才視為有效數字（避免 "4-6人" 被誤判為 46）
    function toNumberOrBlank(value) {
      if (value === null || value === undefined || value === "") return "";
      if (typeof value === "number") return isFinite(value) ? value : "";
      const tokens = String(value).replace(/,/g, "").match(/\d+(?:\.\d+)?/g);
      if (!tokens || tokens.length !== 1) return "";
      return Number(tokens[0]);
    }

    function formatMoney(value) {
      const n = Number(value);
      return value !== "" && value !== null && value !== undefined && !isNaN(n) ? n.toLocaleString() : "—";
    }

    function normalizeRecord(item) {
      if (!item) return null;
      const dateKey = toDateKey(item.dateKey || item.date || item["日期"] || item["預計遊玩日期"]);
      if (!dateKey) return null; // 空白或無法辨識的日期不列入
      const participantsNum = toNumberOrBlank(item.participants ?? item["參與人數"]);
      return {
        no: Number(item.no) || "",
        dateKey,
        title: String(item.title || item["主題"] || "").trim(),
        studio: String(item.studio || item["工作室"] || "").trim(),
        price: toNumberOrBlank(item.price ?? item["Price"]),
        participants: participantsNum !== "" ? participantsNum : String(item.participants ?? item["參與人數"] ?? "").trim()
      };
    }

    // 已預訂：日期 > 今日（近到遠）；已完成：日期 <= 今日（舊到新）
    function getRecordGroups() {
      const today = getTodayKey();
      const list = Array.isArray(allRecords) ? allRecords : [];
      const byDateThenNo = (a, b) => a.dateKey.localeCompare(b.dateKey) || ((Number(a.no) || 0) - (Number(b.no) || 0));
      return {
        today,
        booked: list.filter(r => r.dateKey > today).sort(byDateThenNo),
        completed: list.filter(r => r.dateKey <= today).sort(byDateThenNo)
      };
    }

      const statsBar = document.getElementById("statsBar");

        },
        {

          label: "已預訂主題數",
          value: hasRecords ? booked.length : "—",

          <div class="text-3xl sm:text-4xl font-bold mt-1 text-ink">${c.value}<span class="text-sm font-normal text-muted ml-1">${hasRecords ? "個" : ""}</span></div>

    /* ---------- 原有：工作室、標籤、篩選、卡片、詳情試算 ---------- */

    function renderStudioOptions() {
      const select = document.getElementById("studioSelect");
      const currentVal = select.value;
      const studios = Array.from(new Set(allGames.map(g => g.studio).filter(Boolean)));
      select.innerHTML = `<option value="">全部工作室</option>` + studios.map(s =>
        `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`
      ).join("");

        select.value = currentVal;

    function renderTagChips() {
      const container = document.getElementById("tagChips");
      const tagMap = new Map();
      allGames.forEach(g => {
        splitTags(g.themeType).forEach(tag => {
          tagMap.set(tag, (tagMap.get(tag) || 0) + 1);
        });
      });

      const tags = Array.from(tagMap.entries()).sort((a, b) => b[1] - a[1]);
      if (tags.length === 0) {
        container.innerHTML = `<span class="text-xs text-muted">尚無標籤</span>`;
        return;
      }

      container.innerHTML = tags.map(([tag, count]) => {
        const active = selectedTag === tag;
        return `
          <button
            type="button"
            data-tag="${escapeHtml(tag)}"
            class="tag-chip px-3 py-1 rounded-full text-xs font-bold border-2 transition cursor-pointer ${
              active
                ? "bg-cocoa-600 text-white border-cocoa-600"
                : "bg-paper text-ink border-dashed border-line hover:bg-cocoa-50"
            }"
          >
            ${escapeHtml(tag)} (${count})
          </button>
        `;
      }).join("");

      container.querySelectorAll(".tag-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          const clicked = btn.getAttribute("data-tag");
          selectedTag = selectedTag === clicked ? "" : clicked;
          updateView();
        });
      });

    function getFilteredGames() {
      const kw = document.getElementById("searchInput").value.trim().toLowerCase();
      const studio = document.getElementById("studioSelect").value;
      const maxPriceRaw = document.getElementById("maxPriceInput").value.trim();
      const maxPrice = maxPriceRaw !== "" ? Number(maxPriceRaw) : Infinity;
      const sortBy = document.getElementById("sortSelect").value;

      const list = allGames.filter(g => {
        const hay = `${g.title} ${g.themeType} ${g.studio} ${g.priceRange} ${g.duration}`.toLowerCase();
        if (kw && !hay.includes(kw)) return false;
        if (studio && g.studio !== studio) return false;
        if (!isNaN(maxPrice) && Number(g.price) > maxPrice) return false;
        if (selectedTag && !splitTags(g.themeType).includes(selectedTag)) return false;
        return true;
      });

      list.sort((a, b) => {
        if (sortBy === "price_asc") return (Number(a.price) || 999999) - (Number(b.price) || 999999);
        if (sortBy === "price_desc") return (Number(b.price) || 0) - (Number(a.price) || 0);
        if (sortBy === "players_desc") return (Number(b.players) || 0) - (Number(a.players) || 0);
        return (Number(a.no) || 0) - (Number(b.no) || 0);
      });

      return list;
    }

    /* ---------- Google 試算表同步（主題 + 清單） ---------- */

    async function syncFromSheet(silent = false) {
      const syncBtn = document.getElementById("syncSheetBtn");
      const syncBanner = document.getElementById("syncBanner");
      const statusEl = document.getElementById("importStatus");

      if (syncBtn) syncBtn.disabled = true;
      if (syncBanner) {
        syncBanner.textContent = "⏳ 正在從 Google 試算表同步最新資料...";
        syncBanner.className = "text-xs text-muted mt-2";
      }

      const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), SYNC_TIMEOUT_MS) : null;

      try {
        let res;
        try {
          res = await fetch(`${WEB_APP_URL}?t=${Date.now()}`, controller ? { signal: controller.signal } : undefined);
        } catch (netErr) {
          throw new Error(netErr.name === "AbortError" ? "連線逾時" : "無法連線至 Apps Script（請確認網路或部署權限）");
        }
        if (!res.ok) throw new Error(`伺服器回應 HTTP ${res.status}`);

        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (parseErr) {
          throw new Error("回傳內容不是 JSON，請確認 Web App 的存取權設為「任何人」");
        }
        if (!data.ok || !Array.isArray(data.games)) {
          throw new Error(data.error || "回傳資料格式不正確");
        }

        allGames = data.games.map((item, idx) => ({
          no: Number(item.no) || (idx + 1),
          title: String(item.title || "").trim(),
          themeType: String(item.themeType || "").trim(),
          studio: String(item.studio || "").trim(),
          players: item.players !== "" && item.players !== null && item.players !== undefined ? item.players : "",
          price: toNumberOrBlank(item.price),
          priceRange: String(item.priceRange || "").trim(),
          duration: String(item.duration || "").trim()
        })).filter(g => g.title);

        saveGames(allGames);

        // 「清單」紀錄：後端未提供或讀取失敗時，保留上次成功的本機紀錄並顯示提示
        let recordsMsg = "";
        if (Array.isArray(data.records) && !data.recordsError) {
          allRecords = data.records.map(normalizeRecord).filter(Boolean);
          saveRecords(allRecords);
          recordsNotice = "";
          recordsMsg = `「清單」${allRecords.length} 筆`;
        } else if (data.recordsError) {
          recordsNotice = `「清單」讀取失敗：${data.recordsError}${Array.isArray(allRecords) ? "（目前顯示上次同步的紀錄）" : ""}`;
          recordsMsg = "「清單」讀取失敗";
        } else {
          recordsNotice = "Apps Script 尚未回傳「清單」資料（records），請更新 Apps Script 程式碼並重新部署。";
          recordsMsg = "「清單」未提供";
        }
        if (Array.isArray(data.warnings) && data.warnings.length) {
          console.warn("試算表提醒：", data.warnings);
        }

        if (allGames.length > 0 && !allGames.some(g => g.no === selectedGameNo)) {
          selectedGameNo = allGames[0].no;
        }
        renderStudioOptions();
        updateView();

        const timeLabel = new Date().toLocaleTimeString("zh-TW", { hour12: false, timeZone: TIMEZONE });
        const recordsOk = !recordsNotice;
        if (syncBanner) {
          syncBanner.textContent = `${recordsOk ? "✅" : "⚠️"} 已同步「主題」${allGames.length} 筆、${recordsMsg}（更新時間 ${timeLabel}）`;
          syncBanner.className = `text-xs mt-2 ${recordsOk ? "text-mgreen-700" : "text-morange-700"}`;
        }
        if (statusEl) {
          statusEl.textContent = `✅ 已從試算表同步 ${allGames.length} 筆主題（${timeLabel}）`;
          statusEl.className = "text-xs text-mgreen-700 mr-auto";
        }
      } catch (err) {
        console.error(err);
        if (syncBanner) {
          syncBanner.textContent = `⚠️ 自動同步未完成（${err.message}），目前顯示本機資料`;
          syncBanner.className = "text-xs text-mrose-700 mt-2";
        }
        if (statusEl) {
          statusEl.textContent = `⚠️ 同步失敗：${err.message}`;
          statusEl.className = "text-xs text-mrose-700 mr-auto";
        }
        if (!Array.isArray(allRecords)) {
          recordsNotice = `同步失敗：${err.message}`;
          renderTabs();
        }
        if (!silent) {
          alert(`同步試算表失敗：${err.message}`);
        }
      } finally {
        if (timer) clearTimeout(timer);
        if (syncBtn) syncBtn.disabled = false;
      }
    }

    // 匯入 TSV / CSV / JSON 邏輯（主題資料）
    function parseImportedText(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return [];

      if (trimmed.startsWith("[")) {
        const arr = JSON.parse(trimmed);
        return arr.map((item, idx) => ({
          no: Number(item.no || item.No) || (idx + 1),
          title: String(item.title || item["主題"] || "").trim(),
          themeType: String(item.themeType || item["主題類型"] || "").trim(),
          studio: String(item.studio || item["工作室"] || "").trim(),
          players: item.players || item["人數"] || "",
          price: toNumberOrBlank(item.price || item["Price"]),
          priceRange: String(item.priceRange || item["價格區間"] || "").trim(),
          duration: String(item.duration || item["時長"] || "").trim()
        })).filter(g => g.title);
      }

      const rows = [];
      let currentRow = [];
      let currentCell = "";
      let inQuotes = false;
      const delimiter = trimmed.includes("\t") ? "\t" : ",";

      for (let i = 0; i < trimmed.length; i++) {
        const ch = trimmed[i];
        const next = trimmed[i + 1];
        if (ch === '"') {
          if (inQuotes && next === '"') {
            currentCell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === delimiter && !inQuotes) {
          currentRow.push(currentCell);
          currentCell = "";
        } else if ((ch === "\n" || (ch === "\r" && next === "\n")) && !inQuotes) {
          if (ch === "\r") i++;
          currentRow.push(currentCell);
          rows.push(currentRow);
          currentRow = [];
          currentCell = "";
        } else {
          currentCell += ch;
        }
      }
      if (currentCell.length > 0 || currentRow.length > 0) {
        currentRow.push(currentCell);
        rows.push(currentRow);
      }

      const dataRows = rows.filter(r => r.some(cell => cell.trim() !== ""));
      if (dataRows.length > 0 && dataRows[0][0].trim().toLowerCase() === "no") {
        dataRows.shift();
      }

      return dataRows.map((cols, idx) => ({
        no: Number((cols[0] || "").trim()) || (idx + 1),
        title: (cols[1] || "").trim(),
        themeType: (cols[2] || "").trim(),
        studio: (cols[3] || "").trim(),
        players: (cols[4] || "").trim(),
        price: toNumberOrBlank(cols[5]),
        priceRange: (cols[6] || "").trim(),
        duration: (cols[7] || "").trim()
      })).filter(g => g.title);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 事件綁定
    document.getElementById("syncSheetBtn").addEventListener("click", () => syncFromSheet(false));
    document.getElementById("searchInput").addEventListener("input", updateView);
    document.getElementById("studioSelect").addEventListener("change", updateView);
    document.getElementById("maxPriceInput").addEventListener("input", updateView);
    document.getElementById("sortSelect").addEventListener("change", updateView);

    document.getElementById("resetFiltersBtn").addEventListener("click", () => {
      document.getElementById("searchInput").value = "";
      document.getElementById("studioSelect").value = "";
      document.getElementById("maxPriceInput").value = "";
      document.getElementById("sortSelect").value = "no_asc";
      selectedTag = "";
      updateView();
    });

    document.getElementById("toggleImportBtn").addEventListener("click", () => {
      document.getElementById("importPanel").classList.toggle("hidden");
    });

    document.getElementById("applyImportBtn").addEventListener("click", () => {
      const statusEl = document.getElementById("importStatus");
      try {
        const parsed = parseImportedText(document.getElementById("importTextarea").value);
        if (parsed.length === 0) {
          statusEl.textContent = "⚠️ 未解析到有效主題列，請檢查格式。";
          statusEl.className = "text-xs text-mrose-700 mr-auto";
          return;
        }
        allGames = parsed;
        saveGames(allGames);
        selectedGameNo = allGames[0].no;
        selectedTag = "";
        renderStudioOptions();
        updateView();
        statusEl.textContent = `✅ 已更新並儲存 ${allGames.length} 筆主題資料。`;
        statusEl.className = "text-xs text-mgreen-700 mr-auto";
      } catch (err) {
        statusEl.textContent = `❌ 解析失敗：${err.message}`;
        statusEl.className = "text-xs text-mrose-700 mr-auto";
      }
    });

    document.getElementById("restoreDefaultBtn").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      allGames = JSON.parse(JSON.stringify(DEFAULT_GAMES));
      selectedGameNo = allGames[0].no;
      selectedTag = "";
      document.getElementById("importTextarea").value = "";
      document.getElementById("importStatus").textContent = "已還原預設表格資料。";
      renderStudioOptions();
      updateView();
    });

    // 頁籤切換（滑鼠 + 鍵盤左右鍵）
    const TAB_ORDER = ["booked", "completed", "themes"];
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.getAttribute("data-tab")));
      btn.addEventListener("keydown", e => {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        const idx = TAB_ORDER.indexOf(btn.getAttribute("data-tab"));
        const next = TAB_ORDER[(idx + (e.key === "ArrowRight" ? 1 : TAB_ORDER.length - 1)) % TAB_ORDER.length];
        switchTab(next);
        document.getElementById(`tab-${next}`).focus();
      });
    });

    // 初始化先渲染畫面，再自動向試算表 Web App 同步最新資料
    renderStudioOptions();
    updateView();
    syncFromSheet(true);
  </script>
</body>
